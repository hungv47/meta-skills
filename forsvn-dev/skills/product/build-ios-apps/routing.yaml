# Routing + capability metadata for build-ios-apps.
#
# This skill is the sole intentional exception to the forsvn-skills multi-agent
# quality bar (authored by the Chorus team and vendored unmodified). It still
# carries a capability section so it surfaces in the generated routing registry
# at references/capability-index.json.
promptSignals:
  # Action + platform required. Bare "ios" / "swift" / "xcode" used to fire on
  # review / architecture / explain prompts because they are vocabulary, not
  # intent. Every phrase below carries an explicit build / ship / install /
  # publish / submit / register / test-on verb co-located with a platform noun.
  phrases:
    # Build verb + iOS/iPhone/Swift noun in natural variants. "this" / "the" /
    # "my" / "a" / "an" all get explicit coverage because the scorer is
    # substring-only, so "build this ios app" isn't a substring of any of the
    # "an"/"the"/"my" variants.
    - "build an ios app"
    - "build the ios app"
    - "build my ios app"
    - "build this ios app"
    - "build ios app"
    - "build an iphone app"
    - "build my iphone app"
    - "build this iphone app"
    - "build a swift app"
    - "build my swift app"
    - "build this swift app"
    - "build this app on my iphone"
    - "build this app and install"
    # Test-on-device intent
    - "test on my iphone"
    - "test on my phone"
    - "test on iphone"
    - "put this on my iphone"
    - "put this on my phone"
    - "put this app on my iphone"
    - "put this app on my phone"
    - "ship it to my iphone"
    - "ship this to my iphone"
    - "ship this to my phone"
    # Install / sign / TestFlight
    - "ship to testflight"
    - "install on device"
    - "install on iphone"
    - "install on my iphone"
    - "install this app"
    - "install this app on my iphone"
    - "install this app on my phone"
    - "install this on my iphone"
    - "install this on my phone"
    - "install it on my iphone"
    - "install it on my phone"
    # App Store distribution / review
    - "publish to app store"
    - "publish to the app store"
    - "publish to testflight"
    - "submit my app to app store"
    - "submit to app store"
    - "submit my app for review"
    - "push to testflight"
    - "send for app store review"
    - "send to apple for review"
    - "register device with apple"
    - "apple developer auth"
    - "/build-ios-apps"
  noneOf:
    - "android"
    - "kotlin"
    - "react native"
    - "review this"
    - "review the"
    - "code review"
    - "refactor"
    - "explain how"
    - "architecture of"
    - "design pattern"
  minScore: 6

capability:
  id: build-ios-apps
  domain: product
  public: true
  command: /build-ios-apps
  summary: "Build, sign, install, and publish iOS apps via the Chorus Vibecode signing service. Vendored from Chorus; sole exception to the multi-agent quality bar."
  aliases:
    - ios
    - iphone
    - swift
    - testflight
    - app-store

  route:
    use_when:
      - "User wants to build, sign, install, or publish a Swift / SwiftUI iOS app."
      - "User asks to test an app on a real iPhone or push a preview build to chat."
      - "User asks to register a device, authenticate with Apple, submit for review, or push to TestFlight / App Store."
    not_when:
      - "Building or shipping non-iOS targets (Android, web, server) -> use the matching product skill."
      - "Designing iOS app architecture or feature flow before any build is needed -> architect-system / map-user-flow."
      - "Generic Swift code review or cleanup -> clean-code."
    prerequisites:
      recommended: []
      hard: []

  orchestration:
    default: single
    single_when:
      - "Every invocation. This skill wraps the ./ios-cli pipeline; orchestration weight lives in the CLI, not in agents."
    multi_when:
      - "Never. Vendored Chorus skill intentionally bypasses the multi-agent quality bar; do not fan out."
    critic_required_when:
      - "Never under normal use. Build/sign failures surface as ios-cli exit codes and Xcode logs, not as critic gates."

  load:
    always:
      - "references/capabilities.md"
      - "references/gotchas.md"
    when:
      - if: "user is publishing to App Store or TestFlight"
        read:
          - "references/publishing.md"
          - "references/publishing-readiness.md"
          - "references/publishing-production.md"
          - "references/publishing-testflight.md"
          - "references/publishing-gotchas.md"
          - "references/screenshots.md"
      - if: "user is registering a device or syncing UDIDs with Apple"
        read:
          - "references/device-registration.md"
      - if: "calling ios-cli endpoints directly or debugging signing-service responses"
        read:
          - "references/api-reference.md"
