# Routing + capability metadata for write-docs.
# Source of truth — compiled into:
#   - hooks/skill-registry.json by `node hooks/build-registry.mjs`
#   - references/capability-index.json by `bun scripts/build-capability-index.ts`
# NOT loaded into model context. Edit here, then rebuild both.
promptSignals:
  phrases:
    - "write documentation"
    - "write a readme"
    - "api reference"
    - "setup guide"
    - "runbook"
    - "document this"
    - "release notes"
    - "changelog entry"
    - "what changed in this version"
    - "write the release"
  allOf:
    - [write, documentation]
    - [api, reference]
  anyOf:
    - "documentation"
    - "readme"
    - "docs"
    - "guide"
    - "runbook"
    - "reference"
    - "release notes"
    - "changelog"
  noneOf:
    - "code cleanup"
    - "refactor"
    - "dead code"
  minScore: 6

capability:
  id: write-docs
  domain: product
  public: true
  command: /write-docs
  summary: "Generate documentation from a codebase — READMEs, API references, setup guides, runbooks, ship logs, release notes — with consistent structure and terminology."
  aliases:
    - docs
    - readme
    - api-reference
    - ship-log
    - release-notes

  route:
    use_when:
      - "Codebase needs new docs or a refresh (README, user guide, API reference, config guide, tutorial)."
      - "After PRs that modify env vars, API routes, or configuration (Route C — Sync)."
      - "Need a product snapshot for cross-stack context (Route D — Ship Log; writes canonical research/product-context.md)."
      - "Need a CHANGELOG entry for an imminent release (Route E — Release Notes)."
      - "Auditing existing docs for staleness (Audit mode; no writing)."
    not_when:
      - "Specifying what to build -> discover."
      - "Restructuring code for readability -> clean-code."
      - "Visual brand identity for docs site -> create-brand."
      - "Single-page conversion surface -> brief-landing-page."
    prerequisites:
      recommended:
        - "docs/forsvn/experience/technical.md"
        - "id:product-context"
      hard: []

  orchestration:
    default: auto
    single_when:
      - "Small project (<20 files) auto-downgrades to Single-Agent Fallback."
      - "--fast forces Single-Agent Fallback."
    multi_when:
      - "Default — 6 agents (scanner + concept-extractor + audience-profiler parallel; writer; staleness-checker; critic)."
      - "Monorepo detected; per-package docs needed."
    critic_required_when:
      - "Always — 6 standard critical gates fire on every run (route-specific gates for Routes D + E)."
      - "Safety gates supersede `--fast`."

  load:
    always:
      - "references/_shared/before-starting-check.md"
      - "references/_shared/pre-dispatch-protocol.md"
      - "references/_shared/mode-resolver.md"
    when:
      - if: "Pre-Dispatch (Warm / Cold Start, route-locked Pre-Dispatch for D + E)"
        read:
          - "references/pre-dispatch-prompts.md"
      - if: "Layer dispatch + critic routing"
        read:
          - "references/agent-manifest.md"
      - if: "Default route writer-template"
        read:
          - "references/doc-template.md"
      - if: "Route C — Sync (git diff → targeted updates)"
        read:
          - "references/modes/sync.md"
      - if: "Route D — Ship Log (canonical research/product-context.md + merge-mode check)"
        read:
          - "references/modes/ship-log.md"
          - "references/ship-log-template.md"
      - if: "Route E — Release Notes (CHANGELOG + GH Release + convention-enforcing critic gates)"
        read:
          - "references/modes/release-notes.md"
      - if: "Audit mode (staleness-only, no writes, security-priority ranking)"
        read:
          - "references/modes/audit.md"
      - if: "Artifact write / lifecycle by doc-type"
        read:
          - "references/report-template.md"
      - if: "Critic FAIL / anti-pattern review"
        read:
          - "references/anti-patterns.md"

  outputs:
    artifacts:
      - path: "README.md"
        lifecycle: canonical
        produced_when: "Default route — project README; lifecycle per doc-type table in `report-template.md`."
      - path: "docs/<topic>.md"
        lifecycle: canonical
        produced_when: "Default route — user guide / config / tutorial under docs/."
      - path: "research/product-context.md"
        lifecycle: canonical
        produced_when: "Route D — Ship Log writes canonical cross-stack artifact (merge-mode check required)."
      - path: "CHANGELOG.md"
        lifecycle: snapshot
        produced_when: "Route E — Release Notes prepends a new entry; optionally `--gh-release` prints GitHub Release body."
