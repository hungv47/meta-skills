# Routing + capability metadata for run-eval-loop.
promptSignals:
  phrases:
    - "eval loop"
    - "evaluation scaffold"
    - "eval scaffold"
    - "autoresearch style"
    - "improvement loop"
    - "experiment ledger"
    - "strategy execution evaluation"
    - "loop workspace"
    - "where should evals live"
    - "create a loop"
    - "measurable initiative"
  allOf:
    - [strategy, evaluation]
    - [execution, evaluation]
    - [measure, iterate]
  anyOf:
    - "keep discard"
    - "results.tsv"
    - "closed loop"
    - "feedback loop"
    - "performance loop"
    - "campaign iteration"
  noneOf:
    - "code benchmark"
    - "unit test"
    - "model training"
  # Bumped from 5 to the standard 6 for consistency across the stack.
  # Phrases at +6 still auto-fire; allOf groups at +4 alone never triggered.
  minScore: 6

capability:
  id: run-eval-loop
  domain: meta
  public: true
  command: /run-eval-loop
  summary: "Scaffold + own an evaluation loop workspace — program.md, context.md, results.tsv schema, learnings.md ledger. Owns loop setup; per-cycle eval skills own scoring."
  aliases:
    - eval-loop
    - improvement-loop
    - experiment-ledger

  route:
    use_when:
      - "Need a measurable initiative scaffold (campaign / page / content series)."
      - "Define program.md + context.md + results.tsv schema."
      - "Set up the durable learning ledger."
    not_when:
      - "Scoring a specific cycle -> evaluate-{ad/content/landing-page/campaign/shortform}."
      - "Writing the next-cycle brief -> the relevant brief-* skill."
      - "Diagnosing a metric decline -> diagnose."
    prerequisites:
      recommended:
        - "id:icp-research"
        - "id:product-context"
      hard: []

  orchestration:
    default: single
    single_when:
      - "Loop setup is single-agent (scaffold + critic on the schema)."
    multi_when:
      - "Never — per-cycle scoring is delegated to evaluate-* sibling skills."
    critic_required_when:
      - "Schema validation (results.tsv columns match per-eval-skill requirements)."
      - "Guardrail / kill-criteria + auto-fail thresholds explicit in program.md."

  load:
    always:
      - "references/_shared/eval-loop-spec.md"
      - "references/_shared/before-starting-check.md"
    when:
      - if: "Pre-Dispatch (Cold Start, scope + primary metric)"
        read:
          - "references/_shared/pre-dispatch-protocol.md"
      - if: "Loop-folder scaffold + program.md schema (eval-loop-spec covers it)"
        read:
          - "references/_shared/eval-loop-spec.md"

  outputs:
    artifacts:
      - path: ".forsvn/loops/[slug]/program.md"
        lifecycle: loop
        produced_when: "Loop scaffolded — declares primary metric + guardrails + kill criteria."
      - path: ".forsvn/loops/[slug]/context.md"
        lifecycle: loop-context
        produced_when: "Loop scaffolded — declares ICP + product + competitor context."
      - path: ".forsvn/loops/[slug]/results.tsv"
        lifecycle: evaluation
        produced_when: "Loop scaffolded — 8-column header written; per-cycle rows appended by evaluate-* siblings."
      - path: ".forsvn/loops/[slug]/learnings.md"
        lifecycle: learning
        produced_when: "Loop scaffolded — durable learning ledger (empty at start; per-cycle promotes by evaluate-* siblings)."
