# Routing signals for debate-panel. Source of truth — compiled into hooks/skill-registry.json
# by `node hooks/build-registry.mjs`. NOT loaded into model context. Edit here, then rebuild.
promptSignals:
  phrases:
    - "debate this"
    - "get perspectives"
    - "discuss this from multiple angles"
    - "pros and cons"
    - "multiple viewpoints"
  allOf:
    - [multiple, perspective]
  anyOf:
    - "debate"
    - "perspective"
    - "consensus"
    - "viewpoint"
    - "panel"
    - "multi-agent debate"
  noneOf:
    - "code review"
    - "quality check"
    - "task breakdown"
    - "decompose"
    - "scope this"
  minScore: 6
