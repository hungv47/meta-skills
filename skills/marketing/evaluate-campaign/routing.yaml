    - [campaign, performance]
    - [channel, breakdown]
    - [campaign, not, working]
  anyOf:
    - "cost per acquisition"
    - "CAC"
    - "channel mix"
    - "leads generated"
    - "campaign revenue"
    - "campaign ROI"
    - "blended CAC"
    - "did the campaign land"
  noneOf:
    - "new campaign plan"
    - "plan a campaign"
    - "campaign brief"
    - "single ad performance"
    - "one post results"
  minScore: 6
