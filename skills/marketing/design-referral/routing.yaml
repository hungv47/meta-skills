# Routing + capability metadata for design-referral.
# Source of truth — compiled into:
#   - hooks/skill-registry.json by `node hooks/build-registry.mjs`
#   - references/capability-index.json by `bun bin/build-capability-index.ts`
# NOT loaded into model context. Edit here, then rebuild both.
promptSignals:
  phrases:
    - "referral program"
    - "referral loop"
    - "viral loop"
    - "viral coefficient"
    - "k-factor"
    - "word of mouth"
    - "refer a friend"
    - "invite mechanic"
    - "double-sided incentive"
    - "growth loop"
    - "give get"
    - "share to invite"
  anyOf:
    - "referral"
    - "viral"
    - "k-factor"
    - "viral coefficient"
    - "word of mouth"
    - "refer a friend"
    - "growth loop"
    - "invite reward"
  allOf:
    - [referral, loop]
  noneOf:
    - "affiliate program"
    - "cold outreach"
  minScore: 6

capability:
  id: design-referral
  gate_class: review
  domain: marketing
  public: true
  command: /design-referral
  summary: "Design a referral / viral loop — loop mechanics, K-factor (i x c) + cycle-time math, CAC-bounded incentive economics, a value-triggered ask, and a fraud guard, scored by a quantitative critic."
  aliases:
    - referral-loop
    - viral-loop
    - growth-loop
    - k-factor

  route:
    use_when:
      - "User wants a referral / viral / word-of-mouth loop for a product with retention."
      - "K-factor + cycle-time + incentive-economics reasoning is needed (not just 'add a referral')."
      - "Unit economics exist (or can be elicited) to bound the incentive."
    not_when:
      - "Paid-ad creative -> write-ad."
      - "Channel-mix / which channels -> plan-campaign."
      - "Lifecycle email flows -> design-lifecycle."
      - "Affiliate / partnership / influencer outreach -> write-outreach."
      - "Product has no retention (users churn) -> fix retention first (design-lifecycle)."
    prerequisites:
      recommended:
        - "id:product-context"
        - "id:icp-research"
      hard: []

  orchestration:
    default: multi
    single_when:
      - "--fast forces a single inline pass; safety gates still fire."
    multi_when:
      - "Default — 4 agents (loop-architect -> incentive-economist + mechanic-copy -> critic)."
      - "K math + CPAU/payback economics + falsifiable mechanic."
    critic_required_when:
      - "Always — 6-dim rubric + 4 hard gates (retention / K-computed / CPAU<CAC / no-payout) before delivery."

  load:
    always:
      - "references/_shared/pre-dispatch-protocol.md"
    when:
      - if: "Pre-Dispatch (Cold Start, Missing-Input Hard Blocks)"
        read:
          - "references/procedures/pre-dispatch.md"
      - if: "Layer dispatch + routes"
        read:
          - "references/agent-manifest.md"
      - if: "Loop design (loop-type library + K/cycle math)"
        read:
          - "references/loop-models.md"
      - if: "Incentive pricing (CPAU + payback)"
        read:
          - "references/incentive-economics.md"
      - if: "Critic / 6-dim rubric scoring"
        read:
          - "references/rubric.md"
          - "references/anti-patterns.md"
      - if: "Artifact assembly"
        read:
          - "references/format-conventions.md"
      - if: "Worked-example grounding"
        read:
          - "references/examples/referral-walkthrough.md"

  outputs:
    artifacts:
      - path: "docs/forsvn/artifacts/marketing/design-referral/[loop-type]-[date]-[slug].md"
        lifecycle: pipeline
        produced_when: "Loop mechanics + K/cycle math + incentive economics + mechanic + fraud guard assembled; critic + 4 hard gates PASS."
