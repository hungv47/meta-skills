# Routing + capability metadata for write-longform.
# Source of truth — compiled into:
#   - hooks/skill-registry.json by `node hooks/build-registry.mjs`
#   - references/capability-index.json by `bun bin/build-capability-index.ts`
# NOT loaded into model context. Edit here, then rebuild both.
promptSignals:
  phrases:
    - "blog post"
    - "pillar page"
    - "pillar content"
    - "longform content"
    - "long-form article"
    - "write an essay"
    - "thought leadership"
    - "seo article"
    - "in-depth guide"
    - "authoritative article"
    - "write an article"
  anyOf:
    - "blog post"
    - "pillar"
    - "longform"
    - "long-form"
    - "essay"
    - "article"
    - "thought leadership"
    - "in-depth guide"
  allOf:
    - [write, article]
  noneOf:
    - "social post"
    - "tweet"
    - "ad copy"
    - "landing page"
  minScore: 6

capability:
  id: write-longform
  gate_class: review
  domain: marketing
  public: true
  command: /write-longform
  summary: "Write a longform / pillar piece (blog, pillar page, essay) via research -> outline -> draft -> critic, scored on structure AND originality. For 1500+ word pieces that must argue one thesis and earn their length — not write-copy on a long doc."
  aliases:
    - pillar-content
    - longform-content
    - blog-pillar
    - write-essay

  route:
    use_when:
      - "User wants a 1500+ word piece that argues one thesis and earns citations."
      - "A research -> outline -> draft -> critic pipeline with an originality gate is wanted."
      - "An ownable thesis + a proprietary angle exist (or can be elicited)."
    not_when:
      - "Short conversion copy (headline / CTA / blurb / email) -> write-copy."
      - "Social post / thread -> write-social."
      - "Keyword research / search strategy / topic map -> optimize-seo."
      - "Ad copy -> write-ad."
      - "A content calendar / what to publish when -> plan-campaign."
      - "AI-tell cleanup on a finished draft -> humanmaxxing."
    prerequisites:
      recommended:
        - "id:icp-research"
        - "id:product-context"
        - "id:brand"
      hard: []

  orchestration:
    default: multi
    single_when:
      - "--fast forces research-lite -> outline -> single draft; safety gates still fire."
    multi_when:
      - "Default — 4 agents in strict order (research -> outline -> draft -> critic)."
      - "Originality gate (>=5) + cited-or-marked gate before delivery."
    critic_required_when:
      - "Always — 7-dim rubric with an Originality >=5 floor (the anti-collapse gate)."

  load:
    always:
      - "references/_shared/pre-dispatch-protocol.md"
    when:
      - if: "Pre-Dispatch (Cold Start, Missing-Input Hard Blocks)"
        read:
          - "references/procedures/pre-dispatch.md"
      - if: "Layer dispatch + routes (strict research->outline->draft order)"
        read:
          - "references/agent-manifest.md"
      - if: "Research stage (evidence + consensus + proprietary angle)"
        read:
          - "references/research-method.md"
      - if: "Outline + draft (argument structure + prose craft)"
        read:
          - "references/structure-patterns.md"
      - if: "Critic / 7-dim rubric (Originality first)"
        read:
          - "references/rubric.md"
          - "references/anti-patterns.md"
      - if: "Artifact assembly"
        read:
          - "references/format-conventions.md"
      - if: "Worked-example grounding + anti-collapse proof"
        read:
          - "references/examples/longform-walkthrough.md"

  outputs:
    artifacts:
      - path: "docs/forsvn/artifacts/marketing/write-longform/[piece-type]-[date]-[slug].md"
        lifecycle: pipeline
        produced_when: "Research ledger + outline + draft assembled; critic PASS at Originality >=5 + cited-or-marked gate."
