# Routing + capability metadata for architect-system.
# Source of truth — compiled into:
#   - hooks/skill-registry.json by `node hooks/build-registry.mjs`
#   - references/capability-index.json by `bun scripts/build-capability-index.ts`
# NOT loaded into model context. Edit here, then rebuild both.
promptSignals:
  phrases:
    - "system design"
    - "tech stack"
    - "database schema"
    - "api design"
    - "architecture design"
    - "infrastructure plan"
  allOf:
    - [system, architecture]
    - [tech, stack]
  anyOf:
    - "architecture"
    - "schema"
    - "api"
    - "database"
    - "infrastructure"
    - "deployment"
  noneOf:
    - "user flow"
    - "brand identity"
    - "wireframe"
  minScore: 6

capability:
  id: architect-system
  domain: product
  public: true
  command: /architect-system
  summary: "Design a technical blueprint covering stack, schema, APIs, infrastructure, scaling, and security."
  aliases:
    - architecture
    - system-design
    - tech-stack
    - schema

  route:
    use_when:
      - "User asks for system architecture, tech stack, database schema, API design, or deployment plan."
      - "A product or feature needs a durable technical blueprint before implementation."
      - "A major scale, migration, or integration decision needs explicit tradeoffs."
    not_when:
      - "Requirements are still fuzzy -> discover."
      - "User journey or screen flow -> map-user-flow."
      - "Code-level cleanup -> clean-code."
      - "Extract repeated implementation mechanics -> extract-service."
    prerequisites:
      recommended:
        - "id:product-context"
        - "docs/forsvn/artifacts/meta/specs/[slug].md"
        - "docs/forsvn/artifacts/product/flow/[slug].md"
      hard: []

  orchestration:
    default: auto
    single_when:
      - "Simple product with fewer than three user types and fewer than five data entities."
      - "User supplied stack and only needs a bounded architecture pass."
    multi_when:
      - "Greenfield or migration blueprint with unclear stack, schema, APIs, deployment, and scaling needs."
      - "Architecture becomes the canonical system record."
      - "Security, compliance, scale, or integration risk is material."
    critic_required_when:
      - "Writing or updating architecture/system-architecture.md."
      - "Architecture affects auth, data, external dependencies, deployment, or security."
      - "User asks for tradeoff review."

  load:
    always:
      - "references/pre-dispatch-prompts.md"
      - "references/report-template.md"
      - "references/dependency-classification.md"
    when:
      - if: "choosing stack"
        read:
          - "references/tech-stack-patterns.md"
          - "references/tech-stack-matrix.md"
      - if: "schema or persistence design"
        read:
          - "references/database-patterns.md"
      - if: "API or auth design"
        read:
          - "references/api-patterns.md"
          - "references/auth-patterns.md"
      - if: "deployment or infrastructure design"
        read:
          - "references/deployment-patterns.md"
      - if: "security or scaling risk"
        read:
          - "references/security-patterns.md"
          - "references/failure-modes.md"
      - if: "quality gate or failure review"
        read:
          - "references/anti-patterns.md"

  outputs:
    artifacts:
      - path: "architecture/system-architecture.md"
        id: architecture
        lifecycle: canonical
        produced_when: "Architecture reaches DONE or DONE_WITH_CONCERNS."
