# Routing + capability metadata for brief-product-ui.
promptSignals:
  phrases:
    - "design the ui"
    - "product ui"
    - "interface design"
    - "screen design"
    - "component spec"
    - "design the screens"
  allOf:
    - [design, ui]
    - [screen, spec]
  anyOf:
    - "ui"
    - "interface"
    - "screen"
    - "component"
    - "layout"
    - "design system"
  noneOf:
    - "brand identity"
    - "landing page"
    - "database schema"
  minScore: 6

capability:
  id: brief-product-ui
  domain: product
  public: true
  command: /brief-product-ui
  summary: "Design the in-product interface from a mapped user flow — screen inventory, reusable component system, DESIGN-token application, per-state visual treatments, accessibility floor + buildable handoff. Emits a portable spec, never rendered UI."
  aliases:
    - product-ui
    - interface-design
    - ui-spec
    - screen-design

  route:
    use_when:
      - "A map-user-flow artifact exists and the in-product UI (screens/components/layout/states) needs designing."
      - "Need a brand-tokened, buildable UI spec before architect-system or a coding-agent build."
      - "Hand a feature's screens to a design tool (Figma / Stitch) or coding agent from a validated flow."
    not_when:
      - "Flow logic / screen map -> map-user-flow (the prerequisite)."
      - "Brand identity / tokens -> create-brand."
      - "Conversion landing page -> brief-landing-page."
      - "API / schema / tech architecture -> architect-system."
    prerequisites:
      hard:
        - "id:user-flow"
      recommended:
        - "id:brand"
        - "id:icp-research"

  orchestration:
    default: auto
    single_when:
      - "Single-screen feature; --fast collapses Layer 1 to single-pass."
    multi_when:
      - "Multi-screen feature with a shared component system across surfaces."
    critic_required_when:
      - "Always — the 8-checkpoint rubric (flow grounding, token fidelity, state coverage, no-render) gates every run."

  load:
    always:
      - "references/_shared/before-starting-check.md"
    when:
      - if: "Pre-Dispatch (feature + flow + brand source + target engine)"
        read:
          - "references/_shared/pre-dispatch-protocol.md"
          - "references/procedures/pre-dispatch.md"
      - if: "Critical gates + 8-checkpoint critic rubric"
        read:
          - "references/procedures/gates-and-rubric.md"
      - if: "Agent dispatch"
        read:
          - "references/agent-manifest.md"
          - "references/procedures/dispatch-mechanics.md"
      - if: "Component system + token application + layout"
        read:
          - "references/component-patterns.md"
          - "references/token-application-patterns.md"
          - "references/layout-conventions.md"
      - if: "Artifact format + worked example"
        read:
          - "references/format-conventions.md"
          - "references/examples/saas-dashboard-walkthrough.md"
      - if: "Tool handoff (upstream redirect / terminal fork)"
        read:
          - "references/_shared/tool-redirect.md"
          - "references/_shared/execution-fork.md"
      - if: "Anti-pattern review"
        read:
          - "references/anti-patterns.md"

  outputs:
    artifacts:
      - path: ".forsvn/artifacts/product/brief-product-ui-[YYYY-MM-DD]-[slug].md"
        lifecycle: pipeline
        produced_when: "Critic PASS (all 8 CPs); UI spec artifact."
