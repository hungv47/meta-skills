    - [extract, service]
    - [repeated, logic]
    - [duplicated, callers]
  anyOf:
    - "extract-service"
    - "service layer"
    - "shared mechanics"
    - "copy-pasted"
    - "duplicated across"
  noneOf:
    - "dead code"
    - "system design"
    - "write documentation"
  minScore: 6
