# Routing signals for research-market. Source of truth — compiled into hooks/skill-registry.json
# by `node hooks/build-registry.mjs`. NOT loaded into model context. Edit here, then rebuild.
promptSignals:
  phrases:
    - "market research"
    - "competitive analysis"
    - "market size"
    - "tam sam som"
    - "competitor analysis"
    - "market landscape"
  allOf:
    - [market, landscape]
    - [competitive, dynamics]
  anyOf:
    - "competitor"
    - "market"
    - "whitespace"
    - "sizing"
    - "tam"
  noneOf:
    - "customer persona"
    - "buyer persona"
  minScore: 6
