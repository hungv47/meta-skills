<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="The FORSVN stack — Research, Marketing, Product, and Meta feed a central .forsvn artifact store, which feeds manifest, loops, and review.">
<title>FORSVN — how the stack chains</title>
<desc>A system map: four skill domains (Research, Marketing, Product, Meta) feed a central .forsvn artifact store; the store feeds three outputs — manifest, loops, and review. Leaf-green pulses glide left to right along the connections.</desc>
<style>
  .bg { fill:#004700; }
  .card { fill:#111b14; stroke:#6b7872; stroke-width:1; }
  .hub { fill:#16221a; stroke:#74b36b; stroke-width:1.6; animation:edge 4.6s ease-in-out infinite; }
  .ink { fill:#efe9d1; }
  .dim { fill:#8a9784; }
  .ac { fill:#74b36b; }
  .logo { fill:#74b36b; }
  .div { stroke:#3e4844; stroke-width:1; }
  .wire { fill:none; stroke:#3e4844; stroke-width:2; }
  .pulse { fill:none; stroke:#74b36b; stroke-width:2.6; stroke-linecap:round; stroke-dasharray:9 33; }
  .f1 { animation:flow 2.6s linear infinite; }
  .f2 { animation:flow 2.6s linear infinite; animation-delay:-1.3s; }
  @keyframes flow { to { stroke-dashoffset:-42; } }
  @keyframes edge { 0%,100% { stroke-opacity:0.62; } 50% { stroke-opacity:1; } }
  @media (prefers-reduced-motion: reduce) {
    .f1,.f2 { animation:none; }
    .pulse { opacity:0; }
    .hub { animation:none; stroke-opacity:0.92; }
  }
</style>

<rect class="bg" x="0" y="0" width="1280" height="440" rx="18"/>

<!-- header: FORSVN mark + product lockup -->
<g class="logo" transform="translate(39 17) scale(0.0426)">
  <path d="M276.492 580.673L619.5 115L429.702 580.673H276.492Z"/>
  <path d="M527.57 731.164H172L259.172 607.364H578.612L527.57 731.164Z"/>
  <path d="M804.008 498.492L461 964.164L650.798 498.492H804.008Z"/>
  <path d="M552.93 348H908.5L821.328 471.801H501.888L552.93 348Z"/>
</g>
<text class="ink" x="92" y="46" font-family="'Space Grotesk',ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="600" letter-spacing="2.6">FORSVN</text>
<text class="dim" x="1234" y="46" text-anchor="end" font-family="'Space Grotesk',ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14.5" letter-spacing="0.4">RESEARCH · MARKETING · PRODUCT · META</text>
<line class="div" x1="44" y1="82" x2="1236" y2="82"/>

<!-- connections: domains -> hub -->
<path class="wire" d="M280 132 C 392 132 408 204 520 204"/>
<path class="wire" d="M280 216 C 392 216 408 240 520 240"/>
<path class="wire" d="M280 300 C 392 300 408 276 520 276"/>
<path class="wire" d="M280 384 C 392 384 408 312 520 312"/>
<!-- connections: hub -> outputs -->
<path class="wire" d="M760 198 C 872 198 888 154 1000 154"/>
<path class="wire" d="M760 258 C 872 258 888 258 1000 258"/>
<path class="wire" d="M760 318 C 872 318 888 362 1000 362"/>

<!-- pulses (same paths) -->
<path class="pulse f1" d="M280 132 C 392 132 408 204 520 204"/>
<path class="pulse f1" d="M280 216 C 392 216 408 240 520 240"/>
<path class="pulse f1" d="M280 300 C 392 300 408 276 520 276"/>
<path class="pulse f1" d="M280 384 C 392 384 408 312 520 312"/>
<path class="pulse f2" d="M760 198 C 872 198 888 154 1000 154"/>
<path class="pulse f2" d="M760 258 C 872 258 888 258 1000 258"/>
<path class="pulse f2" d="M760 318 C 872 318 888 362 1000 362"/>

<!-- hub: .forsvn artifact store -->
<rect class="hub" x="520" y="176" width="240" height="164" rx="16"/>
<text class="ink" x="640" y="252" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-weight="600" font-size="29">.forsvn/</text>
<text class="dim" x="640" y="286" text-anchor="middle" font-family="'Space Grotesk',ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" letter-spacing="0.3">artifact store</text>

<!-- domain cards -->
<g font-family="'Space Grotesk',ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="500">
  <rect class="card" x="48" y="105" width="232" height="54" rx="13"/>
  <circle class="ac" cx="78" cy="132" r="4.5"/>
  <text class="ink" x="100" y="139">Research</text>
  <rect class="card" x="48" y="189" width="232" height="54" rx="13"/>
  <circle class="ac" cx="78" cy="216" r="4.5"/>
  <text class="ink" x="100" y="223">Marketing</text>
  <rect class="card" x="48" y="273" width="232" height="54" rx="13"/>
  <circle class="ac" cx="78" cy="300" r="4.5"/>
  <text class="ink" x="100" y="307">Product</text>
  <rect class="card" x="48" y="357" width="232" height="54" rx="13"/>
  <circle class="ac" cx="78" cy="384" r="4.5"/>
  <text class="ink" x="100" y="391">Meta</text>
</g>

<!-- output cards -->
<g font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="19">
  <rect class="card" x="1000" y="127" width="232" height="54" rx="13"/>
  <circle class="ac" cx="1030" cy="154" r="4.5"/>
  <text class="ink" x="1052" y="161">manifest</text>
  <rect class="card" x="1000" y="231" width="232" height="54" rx="13"/>
  <circle class="ac" cx="1030" cy="258" r="4.5"/>
  <text class="ink" x="1052" y="265">loops</text>
  <rect class="card" x="1000" y="335" width="232" height="54" rx="13"/>
  <circle class="ac" cx="1030" cy="362" r="4.5"/>
  <text class="ink" x="1052" y="369">review</text>
</g>
</svg>
