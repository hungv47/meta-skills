<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Agent Skills — 40 skills across Research, Marketing, Product, and Meta flow through .forsvn artifacts into manifest, loops, and review.">
<title>Agent Skills — composable skill stack for AI agents</title>
<desc>A system map: four skill domains (Research, Marketing, Product, Meta) feed a central .forsvn artifact store, which feeds three outputs — manifest, loops, and review. Signal-lime pulses glide left to right along the connections.</desc>
<defs>
  <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#b7ff6e" stop-opacity="0.85"/>
    <stop offset="55%" stop-color="#b7ff6e" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#b7ff6e" stop-opacity="0"/>
  </radialGradient>
</defs>
<style>
  svg { --bg:#0e1c14; --panel:#16271c; --hub:#1b3325; --stroke:#2d4736; --ink:#eef3ec; --dim:#9db3a4; --accent:#b7ff6e; --wire:#2d4736; }
  @media (prefers-color-scheme: light) {
    svg { --bg:#f4f2e8; --panel:#ffffff; --hub:#fbfaf1; --stroke:#dad8c6; --ink:#16271c; --dim:#5d6c60; --accent:#3c7a10; --wire:#d0cebb; }
  }
  .bg { fill:var(--bg); }
  .node { fill:var(--panel); stroke:var(--stroke); stroke-width:1.5; }
  .hubn { fill:var(--hub); stroke:var(--accent); stroke-width:1.6; }
  .ink { fill:var(--ink); }
  .dim { fill:var(--dim); }
  .ac { fill:var(--accent); }
  .div { stroke:var(--stroke); stroke-width:1; }
  .wire { fill:none; stroke:var(--wire); stroke-width:2; }
  .pulse { fill:none; stroke:var(--accent); stroke-width:2.6; stroke-linecap:round; stroke-dasharray:9 33; }
  .f1 { animation:flow 2.6s linear infinite; }
  .f2 { animation:flow 2.6s linear infinite; animation-delay:-1.3s; }
  @keyframes flow { to { stroke-dashoffset:-42; } }
  .glow { animation:breathe 5.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity:0.20; } 50% { opacity:0.46; } }
  @media (prefers-reduced-motion: reduce) {
    .f1,.f2 { animation:none; }
    .pulse { opacity:0; }
    .glow { animation:none; opacity:0.32; }
  }
</style>

<rect class="bg" x="0" y="0" width="1280" height="440" rx="22"/>

<!-- header -->
<rect class="ac" x="44" y="32" width="34" height="34" rx="10"/>
<path d="M53 60 L63 38 M59 60 L69 38" stroke="var(--bg)" stroke-width="3.6" stroke-linecap="round"/>
<text class="ink" x="96" y="62" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif" font-style="italic" font-weight="600" font-size="38">Agent Skills</text>
<text class="dim" x="1236" y="56" text-anchor="end" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" letter-spacing="0.4">40 skills · 4 domains · one stack</text>
<line class="div" x1="44" y1="88" x2="1236" y2="88"/>

<!-- glow behind hub -->
<ellipse class="glow" cx="640" cy="256" rx="210" ry="150" fill="url(#hubGlow)"/>

<!-- connections: domains -> hub -->
<path class="wire" d="M280 130 C 392 130 408 200 520 200"/>
<path class="wire" d="M280 214 C 392 214 408 236 520 236"/>
<path class="wire" d="M280 298 C 392 298 408 276 520 276"/>
<path class="wire" d="M280 382 C 392 382 408 312 520 312"/>
<!-- connections: hub -> outputs -->
<path class="wire" d="M760 192 C 872 192 888 152 1000 152"/>
<path class="wire" d="M760 256 C 872 256 888 256 1000 256"/>
<path class="wire" d="M760 320 C 872 320 888 360 1000 360"/>

<!-- pulses (same paths) -->
<path class="pulse f1" d="M280 130 C 392 130 408 200 520 200"/>
<path class="pulse f1" d="M280 214 C 392 214 408 236 520 236"/>
<path class="pulse f1" d="M280 298 C 392 298 408 276 520 276"/>
<path class="pulse f1" d="M280 382 C 392 382 408 312 520 312"/>
<path class="pulse f2" d="M760 192 C 872 192 888 152 1000 152"/>
<path class="pulse f2" d="M760 256 C 872 256 888 256 1000 256"/>
<path class="pulse f2" d="M760 320 C 872 320 888 360 1000 360"/>

<!-- hub -->
<rect class="hubn" x="520" y="174" width="240" height="164" rx="18"/>
<text class="ink" x="640" y="252" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-weight="600" font-size="30">.forsvn/</text>
<text class="dim" x="640" y="286" text-anchor="middle" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" letter-spacing="0.3">artifact store</text>

<!-- domain nodes -->
<g font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20">
  <rect class="node" x="48" y="103" width="232" height="54" rx="14"/>
  <circle class="ac" cx="78" cy="130" r="4.6"/>
  <text class="ink" x="100" y="137">Research</text>
  <rect class="node" x="48" y="187" width="232" height="54" rx="14"/>
  <circle class="ac" cx="78" cy="214" r="4.6"/>
  <text class="ink" x="100" y="221">Marketing</text>
  <rect class="node" x="48" y="271" width="232" height="54" rx="14"/>
  <circle class="ac" cx="78" cy="298" r="4.6"/>
  <text class="ink" x="100" y="305">Product</text>
  <rect class="node" x="48" y="355" width="232" height="54" rx="14"/>
  <circle class="ac" cx="78" cy="382" r="4.6"/>
  <text class="ink" x="100" y="389">Meta</text>
</g>

<!-- output nodes -->
<g font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace" font-size="19">
  <rect class="node" x="1000" y="125" width="232" height="54" rx="14"/>
  <circle class="ac" cx="1030" cy="152" r="4.6"/>
  <text class="ink" x="1052" y="159">manifest</text>
  <rect class="node" x="1000" y="229" width="232" height="54" rx="14"/>
  <circle class="ac" cx="1030" cy="256" r="4.6"/>
  <text class="ink" x="1052" y="263">loops</text>
  <rect class="node" x="1000" y="333" width="232" height="54" rx="14"/>
  <circle class="ac" cx="1030" cy="360" r="4.6"/>
  <text class="ink" x="1052" y="367">review</text>
</g>
</svg>
